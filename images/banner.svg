 <text x="178" y="514" text-anchor="middle">Solar-first heating</text>
 <rect x="290" y="486" width="196" height="44" rx="22" fill="#006FFF" fill-opacity="0.18" stroke="#3D8BFF" stroke-opacity="0.6"/>
 <text x="388" y="514" text-anchor="middle">Home Assistant</text>
</g>

