<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#070D1A"/><stop offset="1" stop-color="#0B2547"/>
 </linearGradient>
 <radialGradient id="glow" cx="0.78" cy="0.35" r="0.5">
  <stop offset="0" stop-color="#006FFF" stop-opacity="0.35"/><stop offset="1" stop-color="#006FFF" stop-opacity="0"/>
 </radialGradient>
 <linearGradient id="sunfill" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#FFB547" stop-opacity="0.55"/><stop offset="1" stop-color="#FFB547" stop-opacity="0.02"/>
 </linearGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
  <path d="M40 0 H0 V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
 </pattern>
</defs>
<rect width="1280" height="640" fill="url(#bg)"/>
<rect width="1280" height="640" fill="url(#grid)"/>
<rect width="1280" height="640" fill="url(#glow)"/>

<g transform="translate(72 78) scale(0.22)">
  <defs>
    <linearGradient id="ibg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDF1F6"/>
    </linearGradient>
    <linearGradient id="iwater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D8BFF"/>
      <stop offset="1" stop-color="#006FFF"/>
    </linearGradient>
    <clipPath id="itankClip">
      <rect x="170" y="112" width="172" height="300" rx="64"/>
    </clipPath>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#ibg)"/>
  <rect x="8.5" y="8.5" width="495" height="495" rx="111.5" fill="none" stroke="#DCE2EA" stroke-width="1"/>
  <g transform="translate(-18 0)">
  <!-- water inside the tank -->
  <g clip-path="url(#itankClip)">
    <path d="M150 262 C 190 242, 226 242, 256 262 S 322 282, 362 262 L 362 430 L 150 430 Z" fill="url(#iwater)"/>
    <path d="M150 292 C 190 272, 226 272, 256 292 S 322 312, 362 292" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- tank outline -->
  <rect x="170" y="112" width="172" height="300" rx="64" fill="none" stroke="#006FFF" stroke-width="20"/>
  <!-- water connections -->
  <path d="M220 412 v34 M292 412 v34" stroke="#006FFF" stroke-width="20" stroke-linecap="round"/>
  <!-- sun -->
  <g transform="translate(362 150)">
    <circle r="62" fill="#F3F6FA"/>
    <circle r="26" fill="#006FFF"/>
    <g stroke="#006FFF" stroke-width="12" stroke-linecap="round">
      <path d="M0 -42 v-10"/><path d="M0 42 v10"/><path d="M-42 0 h-10"/><path d="M42 0 h10"/>
      <path d="M-30 -30 l-7 -7"/><path d="M30 -30 l7 -7"/><path d="M-30 30 l-7 7"/><path d="M30 30 l7 7"/>
    </g>
  </g>
</g>
</g>
<text x="80" y="300" font-family="Inter Display, Inter" font-weight="700" font-size="92" fill="#FFFFFF" letter-spacing="-2">TankWise</text>
<text x="82" y="352" font-family="Inter" font-size="28" fill="#C9D6EA">Hot water whenever you need it.</text>
<text x="82" y="390" font-family="Inter" font-size="28" fill="#C9D6EA">Solar first, grid only when it’s cheapest.</text>

<g font-family="Inter" font-size="18" font-weight="600" fill="#DCE8FF">
 <rect x="80" y="430" width="196" height="44" rx="22" fill="#006FFF" fill-opacity="0.18" stroke="#3D8BFF" stroke-opacity="0.6"/>
 <text x="178" y="458" text-anchor="middle">Learns your routine</text>
 <rect x="290" y="430" width="196" height="44" rx="22" fill="#006FFF" fill-opacity="0.18" stroke="#3D8BFF" stroke-opacity="0.6"/>
 <text x="388" y="458" text-anchor="middle">Plans 36 h ahead</text>
