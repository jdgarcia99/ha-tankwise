reset_learning:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: tankwise
    part:
      default: all
      selector:
        select:
          translation_key: reset_part
          options:
            - losses
            - demand
            - all

replan:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: tankwise

get_plan:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: tankwise

reimport_history:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: tankwise

boost:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: tankwise
    temperature:
      selector:
        number:
          min: 30
          max: 90
          step: 1
          unit_of_measurement: "°C"
    liters:
      selector:
        number:
          min: 1
          max: 500
          step: 5
          unit_of_measurement: L
    duration:
      selector:
        number:
          min: 0
          max: 480
          step: 5
          unit_of_measurement: min

cancel_boost:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: tankwise

discard_last_cutoff_sample:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: tankwise

discard_cutoff_sample:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: tankwise
    value:
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          mode: box
          unit_of_measurement: "°C"
    index:
      selector:
        number:
          min: -20
          max: 19
          step: 1
          mode: box

reset_usable_factor:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: tankwise
