[project]
name = "ha-tankwise"
version = "0.12.2"
description = "Home Assistant integration that plans the energy needs of an electric hot water tank."
license = "MIT"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Report tables of the simulation bench are clearer on one line each.
"tests/simulation/bench.py" = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.tankwise"]
combine-as-imports = true
